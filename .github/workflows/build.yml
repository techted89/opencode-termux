name: Build OpenCode for Android/Termux

on:
  # Trigger on tag pushes for releases
  push:
    tags:
      - 'v*'
  # Trigger on PRs to main for validation
  pull_request:
    branches:
      - main
      - master
  # Manual trigger with version input
  workflow_dispatch:
    inputs:
      opencode_version:
        description: 'OpenCode version to build'
        required: false
        default: '1.19.4'
      force_rebuild:
        description: 'Force rebuild ignoring cache'
        required: false
        default: 'false'
        type: boolean
      release_tag:
        description: 'Optional release tag for manual builds (creates or updates a release)'
        required: false

env:
  # Core versions - pinned for reproducibility
  BUN_VERSION: "1.2.13"
  OPENCODE_VERSION: "1.19.4"
  OPENTUI_VERSION: "0.5.10"
  ANDROID_API: "24"
  ANDROID_NDK_VERSION: "28.1.13356709"
  WEBKIT_COMMIT: "017930ebf915121f8f593bef61cbbca82d78132d"
  TINYCC_COMMIT: "b91835d8701523e895a2b447713630069514e291"
  ICU_VERSION: "75.1"
  ZIG_VERSION: "0.16.0"
  # CompiledModuleGraphFile stride; must match the target Bun (1.2.13).
  MODULE_GRAPH_STRIDE: "36"
  # Build configuration
  JOBS: "4"
  WORK_DIR: "./build"
  # Cache configuration
  CACHE_ENABLE_CROSS_OS: "true"
  CACHE_VERSION: "v2"

jobs:
  # -----------------------------------------------------------------------
  # Build Android aarch64 - Main compilation job
  # -----------------------------------------------------------------------
  build-android-aarch64:
    name: Build Android aarch64
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours for full build
    # Allow manual retry on failure
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    # softprops/action-gh-release needs contents: write; the repository default
    # for GITHUB_TOKEN is read-only, so the tag release step would 403 without
    # this explicit grant.
    permissions:
      contents: write

    env:
      # Runner-specific paths
      TERMUX_HOME_TARGET: /data/data/com.termux/files/home/opencode-termux
      NDK_DIR: /opt/android-ndk

    steps:
      # ======================================================================
      # Context7 MCP Research Gate: Checkout with full history for patching
      # ======================================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Preserve file timestamps for build reproducibility
          persist-credentials: true

      - name: Override OpenCode version from input
        if: github.event.inputs.opencode_version
        run: echo "OPENCODE_VERSION=${{ github.event.inputs.opencode_version }}" >> $GITHUB_ENV

      - name: Initialize Workspace and Termux Directories
        run: |
          mkdir -p "$WORK_DIR"
          echo "Work directory: $WORK_DIR"
          df -h .

      # ======================================================================
      # Install build dependencies with proper caching
      # ======================================================================
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build python3 ruby perl \
            git curl wget unzip xz-utils zip \
            build-essential pkg-config \
            libxml2-dev libxslt1-dev \
            golang-go \
            autoconf automake libtool \
            patchelf

      - name: Install CMake 3.28+
        run: |
          # Ubuntu 22.04 ships CMake 3.22 but Bun needs 3.24+
          CMAKE_VER="3.28.6"
          if cmake --version 2>/dev/null | grep -q "3\.2[89]\|3\.[3-9]"; then
            echo "CMake already new enough: $(cmake --version | head -1)"
          else
            echo "Installing CMake ${CMAKE_VER}..."
            cd /tmp
            wget -q "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/cmake-${CMAKE_VER}-linux-x86_64.tar.gz" -O cmake.tar.gz
            sudo tar xzf cmake.tar.gz -C /opt/
            sudo ln -sf "/opt/cmake-${CMAKE_VER}-linux-x86_64/bin/cmake" /usr/local/bin/cmake
            sudo ln -sf "/opt/cmake-${CMAKE_VER}-linux-x86_64/bin/ctest" /usr/local/bin/ctest
            sudo ln -sf "/opt/cmake-${CMAKE_VER}-linux-x86_64/bin/cpack" /usr/local/bin/cpack
            rm cmake.tar.gz
          fi
          cmake --version

      - name: Install Android NDK r28b
        run: |
          if [ -d "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64" ]; then
            echo "NDK already installed at $NDK_DIR"
          else
            echo "Downloading Android NDK r28b..."
            cd /tmp
            wget -q "https://dl.google.com/android/repository/android-ndk-r28b-linux.zip" -O ndk.zip
            sudo mkdir -p /opt
            sudo unzip -q ndk.zip -d /opt/
            sudo mv /opt/android-ndk-r28b "$NDK_DIR"
            rm ndk.zip
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Install Rust with Android target
        run: |
          if ! command -v rustup &>/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
            source "$HOME/.cargo/env"
          fi
          rustup target add aarch64-linux-android

      - name: Install Zig ${ZIG_VERSION}
        run: |
          ZIG_DIR="$WORK_DIR/zig-${ZIG_VERSION}"
          if [ -x "$ZIG_DIR/zig" ]; then
            echo "Zig already installed at $ZIG_DIR"
          else
            echo "Downloading Zig ${ZIG_VERSION}..."
            wget -q "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -O zig.tar.xz
            mkdir -p "$ZIG_DIR"
            tar xf zig.tar.xz -C "$ZIG_DIR" --strip-components=1
            rm zig.tar.xz
          fi
          echo "ZIG_BIN=$ZIG_DIR/zig" >> $GITHUB_ENV
          echo "$ZIG_DIR" >> $GITHUB_PATH

      - name: Install Bun (host, pinned for module graph compatibility)
        run: |
          # Bun.build({ compile }) is silently ignored by 1.2.13 (no binary is
          # written). 1.3.2 implements it and still emits the 36-byte module
          # graph; transplant-bun-graph.py down-converts its 32-byte Offsets to
          # the 24-byte form the 1.2.13 Android runtime reads.
          HOST_BUN_VERSION="1.3.2"
          GOT="$(bun --version 2>/dev/null || true)"
          if [ "$GOT" != "$HOST_BUN_VERSION" ]; then
            echo "Installing Bun v${HOST_BUN_VERSION} (current: ${GOT:-none})..."
            curl -fsSL https://bun.sh/install | bash -s "bun-v${HOST_BUN_VERSION}"
            echo "$HOME/.bun/bin" >> $GITHUB_PATH
            export PATH="$HOME/.bun/bin:$PATH"
          fi
          ACTUAL="$(bun --version)"
          echo "Host Bun version: $ACTUAL"
          echo "Target Bun version: $BUN_VERSION"
          if [ "$ACTUAL" != "$HOST_BUN_VERSION" ]; then
            echo "ERROR: expected host Bun $HOST_BUN_VERSION, got $ACTUAL" >&2
            exit 1
          fi

      - name: Pre-install @types/bun and native packages to avoid git clone in CI
        run: |
          bun add -g @types/bun@1.2.13
          bun add -g @opentui/core-linux-arm64@0.5.10 2>/dev/null || true
          bun add -g @opentui/core-linux-x64@0.5.10 2>/dev/null || true
          bun add -g @opentui/core-linux-arm64-musl@0.5.10 2>/dev/null || true
          bun add -g @opentui/core-linux-x64-musl@0.5.10 2>/dev/null || true

      - name: Verify Bun, @types/bun and native packages
        run: |
          echo "Host Bun: $(bun --version)"
          echo "@types/bun available: $(bun pm ls -g | grep @types/bun || echo 'not found')"
          echo "Native packages:"
          bun pm ls -g | grep @opentui || echo "  (no @opentui packages found globally)"

      # ======================================================================
      # Cache expensive build artifacts with cross-OS support
      # ======================================================================
      - name: Lint patch application
        run: python3 scripts/lint-patch-application.py

      - name: Compute patch hashes
        id: hashes
        run: |
          BUN_PATCH_HASH=$(cat patches/bun/*.patch | sha256sum | cut -c1-16)
          WEBKIT_PATCH_HASH=$(sha256sum patches/webkit/android-support.patch | cut -c1-16)
          ZIG_PATCH_HASH=$(sha256sum patches/zig/posix-android-sigaction.patch | cut -c1-16)
          OPENTUI_PATCH_HASH=$(sha256sum patches/opentui/v2-0.5.10-android.patch | cut -c1-16)
          echo "bun_patch_hash=$BUN_PATCH_HASH" >> $GITHUB_OUTPUT
          echo "webkit_patch_hash=$WEBKIT_PATCH_HASH" >> $GITHUB_OUTPUT
          echo "zig_patch_hash=$ZIG_PATCH_HASH" >> $GITHUB_OUTPUT
          echo "opentui_patch_hash=$OPENTUI_PATCH_HASH" >> $GITHUB_OUTPUT

      - name: Restore ICU cache
        id: cache-icu
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK_DIR }}/deps-android/prefix
          key: ${{ env.CACHE_VERSION }}-${{ runner.os }}-icu-${{ env.ICU_VERSION }}-api${{ env.ANDROID_API }}-ndk${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('scripts/build-icu.sh', 'scripts/env.sh') }}

      - name: Restore WebKit cache
        id: cache-webkit
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK_DIR }}/webkit-android
          key: ${{ env.CACHE_VERSION }}-${{ runner.os }}-webkit-${{ env.WEBKIT_COMMIT }}-${{ steps.hashes.outputs.webkit_patch_hash }}-icu${{ env.ICU_VERSION }}-api${{ env.ANDROID_API }}-ndk${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('scripts/build-webkit.sh', 'scripts/build-icu.sh', 'scripts/env.sh', 'cmake/webkit-android-toolchain.cmake') }}

      - name: Restore Bun binary cache
        id: cache-bun
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK_DIR }}/bun-build/bun
          key: ${{ env.CACHE_VERSION }}-${{ runner.os }}-bun-${{ env.BUN_VERSION }}-zig${{ env.ZIG_VERSION }}-icu${{ env.ICU_VERSION }}-api${{ env.ANDROID_API }}-${{ steps.hashes.outputs.bun_patch_hash }}-${{ steps.hashes.outputs.zig_patch_hash }}-webkit${{ env.WEBKIT_COMMIT }}-${{ steps.hashes.outputs.webkit_patch_hash }}-${{ hashFiles('scripts/build-bun.sh', 'scripts/build-webkit.sh', 'scripts/build-icu.sh', 'scripts/env.sh') }}

      - name: Restore Zig build cache
        id: cache-zig
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK_DIR }}/bun-build/cache/zig
          key: ${{ env.CACHE_VERSION }}-${{ runner.os }}-bun-zig-${{ env.BUN_VERSION }}-${{ env.ZIG_VERSION }}-${{ steps.hashes.outputs.zig_patch_hash }}-${{ steps.hashes.outputs.bun_patch_hash }}-${{ hashFiles('scripts/build-bun.sh', 'scripts/env.sh') }}

      - name: Restore libopentui cache
        id: cache-opentui
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK_DIR }}/opentui-src/packages/native/lib/aarch64-linux-android/libopentui.so
          key: ${{ env.CACHE_VERSION }}-${{ runner.os }}-opentui-${{ env.OPENTUI_VERSION }}-${{ hashFiles('patches/opentui/*.patch') }}-zig${{ env.ZIG_VERSION }}-api${{ env.ANDROID_API }}-ndk${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('scripts/build-opentui.sh', 'scripts/env.sh') }}

      # ======================================================================
      # Active Runner Log Surveillance: Dynamic patch verification
      # ======================================================================
      - name: Verify patch integrity and apply missing dependencies
        run: |
          source scripts/env.sh
          
          # Check for missing zlib in ghostty build.zig.zon
          GHOSTTY_ZON="${OPENTUI_SRC}/packages/native/zig-deps/ghostty/build.zig.zon"
          if [ -f "$GHOSTTY_ZON" ] && ! grep -q "zlib" "$GHOSTTY_ZON"; then
            echo "[!] Missing zlib dependency in ghostty build.zig.zon - applying fix"
            python3 -c 'import sys; zon_path=sys.argv[1]; content=open(zon_path).read(); zlib_block="""\n    .zlib = .{\n        .url = \"https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz\",\n        .hash = \"N-V-__8AAJj_QgDBhU17TCtcvdjOZZPDfkvxrEAyZkc14VN8\",\n    },\n"""; content=content.replace(".dependencies = .{", ".dependencies = .{" + zlib_block) if ".dependencies = .{" in content else content; open(zon_path,"w").write(content)' "$GHOSTTY_ZON"
            echo "[✓] Applied zlib dependency fix"
          fi
          
          # uucode-ghostty is populated by build-opentui.sh. Do not pre-create
          # the directory here: the completeness check in that script keys on a
          # file from the package, and an empty directory made it skip the
          # extraction (run 41280659177).

      # ======================================================================
      # Build libopentui.so first. It needs only Zig + NDK + OpenTUI, so a
      # generator/API error fails in about a minute instead of after ICU,
      # WebKit and Bun have already spent ~30 minutes.
      # ======================================================================
      - name: Build libopentui.so
        if: steps.cache-opentui.outputs.cache-hit != 'true'
        timeout-minutes: 60
        run: |
          source scripts/env.sh
          ./scripts/build-opentui.sh

      - name: Verify libopentui.so
        run: |
          source scripts/env.sh
          LIBOPENTUI="${OPENTUI_SRC}/packages/native/lib/aarch64-linux-android/libopentui.so"
          if [ -f "$LIBOPENTUI" ]; then
            echo "Found libopentui.so at $LIBOPENTUI"
            file "$LIBOPENTUI"
            readelf -d "$LIBOPENTUI" | grep NEEDED
          else
            echo "ERROR: libopentui.so not found at $LIBOPENTUI"
            echo "Checking alternative location..."
            ALT_LIBOPENTUI="${OPENTUI_SRC}/packages/core/src/lib/aarch64-linux-android/libopentui.so"
            if [ -f "$ALT_LIBOPENTUI" ]; then
              echo "Found at alternative location: $ALT_LIBOPENTUI"
              file "$ALT_LIBOPENTUI"
              readelf -d "$ALT_LIBOPENTUI" | grep NEEDED
            else
              find "${OPENTUI_SRC}" -name "libopentui.so" -type f 2>/dev/null
              exit 1
            fi
          fi

      - name: Stage libopentui.so for packaging
        run: |
          source scripts/env.sh
          LIB="${OPENTUI_SRC}/packages/native/lib/aarch64-linux-android/libopentui.so"
          if [ ! -f "$LIB" ]; then
            LIB="${OPENTUI_SRC}/packages/core/src/lib/aarch64-linux-android/libopentui.so"
          fi
          if [ ! -f "$LIB" ]; then
            echo "ERROR: libopentui.so missing after build/cache restore" >&2
            exit 1
          fi
          mkdir -p "${WEBKIT_OUTPUT}/lib" \
                   "${OPENTUI_SRC}/packages/core/src/lib/aarch64-linux-android"
          cp "$LIB" "${WEBKIT_OUTPUT}/lib/libopentui.so"
          cp "$LIB" "${OPENTUI_SRC}/packages/core/src/lib/aarch64-linux-android/libopentui.so"

      - name: Save libopentui cache
        if: success() && steps.cache-opentui.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WORK_DIR }}/opentui-src/packages/native/lib/aarch64-linux-android/libopentui.so
          key: ${{ steps.cache-opentui.outputs.cache-primary-key }}

      - name: Clone and patch Bun
        if: steps.cache-bun.outputs.cache-hit != 'true'
        run: |
          source scripts/env.sh
          ./scripts/apply-patches.sh bun

      - name: Clone and patch WebKit
        if: steps.cache-webkit.outputs.cache-hit != 'true'
        run: |
          source scripts/env.sh
          ./scripts/apply-patches.sh webkit

      # ======================================================================
      # Build ICU with timeout protection
      # ======================================================================
      - name: Build ICU 75.1
        if: steps.cache-icu.outputs.cache-hit != 'true'
        timeout-minutes: 60
        run: |
          source scripts/env.sh
          ./scripts/build-icu.sh

      - name: Save ICU cache
        if: success() && steps.cache-icu.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WORK_DIR }}/deps-android/prefix
          key: ${{ steps.cache-icu.outputs.cache-primary-key }}

      # ======================================================================
      # Build WebKit/JSC with timeout protection
      # ======================================================================
      - name: Build WebKit/JSC
        if: steps.cache-webkit.outputs.cache-hit != 'true'
        timeout-minutes: 120
        run: |
          source scripts/env.sh
          ./scripts/build-webkit.sh

      - name: Save WebKit cache
        if: success() && steps.cache-webkit.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WORK_DIR }}/webkit-android
          key: ${{ steps.cache-webkit.outputs.cache-primary-key }}

      # ======================================================================
      # Build TinyCC (libtcc.a)
      # ======================================================================
      - name: Build TinyCC
        if: steps.cache-bun.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: |
          source scripts/env.sh
          ./scripts/build-tinycc.sh

      # ======================================================================
      # Build Bun with timeout protection
      # ======================================================================
      - name: Build Bun
        if: steps.cache-bun.outputs.cache-hit != 'true'
        timeout-minutes: 120
        env:
          ZIG_CACHE_REUSE: ${{ steps.cache-zig.outputs.cache-hit }}
        run: |
          source scripts/env.sh
          # Need to clone + patch if only bun cache missed but webkit didn't
          if [ ! -d "$BUN_SRC/.git" ]; then
            ./scripts/apply-patches.sh bun
          fi
          ./scripts/build-bun.sh

      - name: Verify Bun binary
        run: |
          BUN_BINARY="${WORK_DIR}/bun-build/bun"
          echo "Bun binary: $BUN_BINARY"
          ls -lh "$BUN_BINARY"
          file "$BUN_BINARY"
          readelf -h "$BUN_BINARY" | grep -E "Machine|Class"
          if ! file "$BUN_BINARY" | grep -q "aarch64"; then
            echo "ERROR: Bun binary is not ARM64 architecture"
            exit 1
          fi

      - name: Save Bun binary cache
        if: success() && steps.cache-bun.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WORK_DIR }}/bun-build/bun
          key: ${{ steps.cache-bun.outputs.cache-primary-key }}

      - name: Save Zig build cache
        if: success() && steps.cache-bun.outputs.cache-hit != 'true' && steps.cache-zig.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WORK_DIR }}/bun-build/cache/zig
          key: ${{ steps.cache-zig.outputs.cache-primary-key }}

      # ======================================================================
      # Build OpenCode standalone binary
      - name: Clone OpenCode source
        run: |
          source scripts/env.sh
          if [ ! -d "$OPENCODE_SRC/.git" ]; then
            git clone --depth 1 --branch "v${OPENCODE_VERSION}" https://github.com/anomalyco/opencode.git "$OPENCODE_SRC"
          fi

      - name: Restore OpenCode node_modules cache
        id: cache-opencode-deps
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.WORK_DIR }}/opencode-src/node_modules
            ~/.bun/install/cache
          key: ${{ env.CACHE_VERSION }}-${{ runner.os }}-opencode-deps-${{ env.OPENCODE_VERSION }}-${{ env.BUN_VERSION }}-${{ hashFiles('build/opencode-src/bun.lock*', 'build/opencode-src/package.json', 'scripts/build-opencode.sh', 'scripts/build-opencode-android.ts', 'scripts/transplant-bun-graph.py') }}

      # ======================================================================
      - name: Build OpenCode standalone binary
        timeout-minutes: 60
        run: |
          source scripts/env.sh
          ./scripts/build-opencode.sh

      - name: Save OpenCode node_modules cache
        if: success() && steps.cache-opencode-deps.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.WORK_DIR }}/opencode-src/node_modules
            ~/.bun/install/cache
          key: ${{ steps.cache-opencode-deps.outputs.cache-primary-key }}

      # ======================================================================
      - name: Verify staged native libraries
        run: |
          source scripts/env.sh
          echo "=== Verifying staged native libraries ==="
          LIB="${WORK_DIR}/dist/lib/libopentui.so"
          CXX="${WORK_DIR}/dist/lib/libc++_shared.so"
          [ -f "$LIB" ] || { echo "ERROR: $LIB missing" >&2; exit 1; }
          [ -f "$CXX" ] || { echo "ERROR: $CXX missing" >&2; exit 1; }
          file "$LIB" | grep -q "aarch64" || { echo "ERROR: libopentui.so is not aarch64" >&2; file "$LIB"; exit 1; }
          file "$CXX" | grep -q "aarch64" || { echo "ERROR: libc++_shared.so is not aarch64" >&2; file "$CXX"; exit 1; }
          readelf -d "$LIB" | grep -q "NEEDED.*libc.so" || { echo "ERROR: libopentui.so is missing NEEDED libc.so" >&2; readelf -d "$LIB"; exit 1; }
          echo "staged native libraries OK"

      - name: Verify OpenCode binary
        run: |
          source scripts/env.sh
          LIBEXEC="${WORK_DIR}/dist/libexec/opencode/opencode.bin"
          LAUNCHER="${WORK_DIR}/dist/bin/opencode"
          echo "OpenCode binary: $LIBEXEC"
          ls -lh "$LIBEXEC" "$LAUNCHER"
          file "$LIBEXEC"
          readelf -h "$LIBEXEC" | grep -E "Machine|Class"
          readelf -lW "$LIBEXEC" | grep -E "GNU_RELRO|GNU_STACK" || true
          if ! file "$LIBEXEC" | grep -q "aarch64"; then
            echo "ERROR: OpenCode binary is not ARM64 architecture"
            exit 1
          fi
          # Validate the transplanted module graph (offsets, stride, footer).
          python3 scripts/transplant-bun-graph.py verify "$LIBEXEC" --expect-stride "$MODULE_GRAPH_STRIDE"
          # The Termux launcher must hand Bun the real graph-bearing path. Without
          # this, Termux's linker64 /proc/self/exe fallback runs Bun's CLI instead.
          sh -n "$LAUNCHER"
          grep -qF 'export BUN_SELF_EXE=' "$LAUNCHER" || { echo "ERROR: launcher does not export BUN_SELF_EXE" >&2; exit 1; }
          grep -aqF 'BUN_SELF_EXE' "$LIBEXEC" || { echo "ERROR: Bun runtime lacks the BUN_SELF_EXE override" >&2; exit 1; }
          echo "=== Staged layout ==="
          find "${WORK_DIR}/dist" -maxdepth 3 -type f | sort

      # ======================================================================
      # Create packages
      # ======================================================================
      - name: Create distribution packages
        run: |
          source scripts/env.sh
          ./scripts/make-packages.sh

      - name: List packages
        run: |
          echo "=== Built packages ==="
          ls -lh "${WORK_DIR}/packages/"

      # ======================================================================
      # Upload artifacts with improved configuration
      # ======================================================================
      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: opencode-termux-${{ env.OPENCODE_VERSION }}-${{ runner.os }}-${{ github.run_id }}
          path: |
            ${{ env.WORK_DIR }}/packages/*.zip
            ${{ env.WORK_DIR }}/packages/opencode-*-android-aarch64.tar.xz
            ${{ env.WORK_DIR }}/packages/*.pkg.tar.xz
            ${{ env.WORK_DIR }}/packages/*.deb
            ${{ env.WORK_DIR }}/packages/SHA256SUMS
            ${{ env.WORK_DIR }}/packages/install-termux.sh
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          overwrite: true

      # Also upload the libopentui.so separately for debugging
      - name: Upload libopentui.so for debugging
        uses: actions/upload-artifact@v7
        with:
          name: libopentui-so-${{ env.OPENTUI_VERSION }}-${{ runner.os }}-${{ github.run_id }}
          path: |
            ${{ env.WORK_DIR }}/opentui-src/packages/native/lib/aarch64-linux-android/libopentui.so
            ${{ env.WORK_DIR }}/opentui-src/packages/core/src/lib/aarch64-linux-android/libopentui.so
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      # ======================================================================
      # Release (tag push, or manual workflow_dispatch with release_tag)
      # ======================================================================
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            ${{ env.WORK_DIR }}/packages/*.zip
            ${{ env.WORK_DIR }}/packages/opencode-*-android-aarch64.tar.xz
            ${{ env.WORK_DIR }}/packages/*.pkg.tar.xz
            ${{ env.WORK_DIR }}/packages/*.deb
            ${{ env.WORK_DIR }}/packages/SHA256SUMS
            ${{ env.WORK_DIR }}/packages/install-termux.sh
          body: |
            ## OpenCode ${{ env.OPENCODE_VERSION }} for Android/Termux (aarch64)

            Built from commit `${{ github.sha }}` with the Termux `/proc/self/exe`
            fix: the launcher exports `BUN_SELF_EXE`, and the Bun runtime honors it,
            so the embedded module graph loads even when Termux enters the binary
            through `linker64`.

            ### Install (root-free, recommended)

            ```bash
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.release_tag || github.ref_name }}/install-termux.sh
            chmod +x install-termux.sh
            ./install-termux.sh https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.release_tag || github.ref_name }}/opencode-${{ env.OPENCODE_VERSION }}-android-aarch64.tar.xz
            ```

            The installer verifies `SHA256SUMS`, checks the aarch64 ELF headers, and
            backs up an existing launcher.

            ### Archives

            The `.zip` and `.tar.xz` contain the complete `$PREFIX` layout
            (`bin/opencode`, `libexec/opencode/opencode.bin`, `lib/*.so`):

            ```bash
            unzip -o opencode-${{ env.OPENCODE_VERSION }}-android-aarch64.zip -d "$PREFIX"
            # or
            tar -xJf opencode-${{ env.OPENCODE_VERSION }}-android-aarch64.tar.xz -C "$PREFIX"
            ```

            ### Package manager

            **Termux (pacman):**
            ```bash
            pacman -U opencode-${{ env.OPENCODE_VERSION }}-1-aarch64.pkg.tar.xz
            ```

            **Termux (dpkg):**
            ```bash
            dpkg -i opencode_${{ env.OPENCODE_VERSION }}_aarch64.deb
            ```

            ### Verify

            ```bash
            opencode --version   # ${{ env.OPENCODE_VERSION }}
            ```

            ### Build info
            - Bun: v${{ env.BUN_VERSION }} (cross-compiled for Android aarch64)
            - WebKit/JSC: ${{ env.WEBKIT_COMMIT }}
            - ICU: ${{ env.ICU_VERSION }}
            - Android API level: ${{ env.ANDROID_API }}
            - NDK: r28b (${{ env.ANDROID_NDK_VERSION }})
          draft: false
          prerelease: false
          generate_release_notes: true

      # ======================================================================
      # Cleanup (keep cache, remove intermediates)
      # ======================================================================
      - name: Cleanup intermediate files
        if: always()
        run: |
          # Remove source trees (they can be re-cloned) but keep cached artifacts
          rm -rf "${WORK_DIR}/bun-src" "${WORK_DIR}/webkit-src" "${WORK_DIR}/opentui-src" "${WORK_DIR}/opencode-src"
          rm -rf "${WORK_DIR}/icu-src" "${WORK_DIR}/icu-host-build" "${WORK_DIR}/icu-android-build"
          rm -rf "${WORK_DIR}/webkit-build"
          # The Zig cache was saved after Verify Bun; remove the local copy to
          # free disk. The remote cache is keyed by Bun/Zig versions + patch.
          rm -rf "${WORK_DIR}/bun-build/cache/zig"
          echo "Cleaned up intermediate files"
          df -h "${WORK_DIR}" || true

  # -----------------------------------------------------------------------
  # Validate Build Artifacts - Separate validation job
  # -----------------------------------------------------------------------
  validate-artifacts:
    name: Validate Build Artifacts
    runs-on: ubuntu-latest
    needs: build-android-aarch64
    if: always() && needs.build-android-aarch64.result == 'success'
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: opencode-termux-*
          merge-multiple: true
          path: artifacts

      - name: Validate artifact structure
        run: |
          echo "=== Validating artifacts ==="
          ls -la artifacts/
          
          # Verify packages exist
          if ls artifacts/*.zip 1> /dev/null 2>&1; then
            echo "✓ ZIP package found"
            unzip -l artifacts/*.zip | head -20
          else
            echo "ERROR: No ZIP package found"
            exit 1
          fi

          if ls artifacts/*android-aarch64.tar.xz 1> /dev/null 2>&1; then
            echo "✓ tar.xz archive found"
            tar -tf artifacts/*android-aarch64.tar.xz | head -20
          else
            echo "ERROR: No tar.xz archive found"
            exit 1
          fi
          
          if ls artifacts/*.pkg.tar.xz 1> /dev/null 2>&1; then
            echo "✓ Pacman package found"
            tar -tf artifacts/*.pkg.tar.xz | grep -E "bin/opencode$|opencode\.bin$|libopentui\.so$|PKGINFO" | head -20
          else
            echo "WARNING: No pacman package found"
          fi
          
          if ls artifacts/*.deb 1> /dev/null 2>&1; then
            echo "✓ DEB package found"
            dpkg -c artifacts/*.deb | head -20
          else
            echo "WARNING: No DEB package found"
          fi

          # SHA256SUMS and the root-free installer must be part of the artifact
          if [ -f artifacts/SHA256SUMS ]; then
            echo "✓ SHA256SUMS found"
            cat artifacts/SHA256SUMS
          else
            echo "ERROR: SHA256SUMS missing"
            exit 1
          fi

          if [ -f artifacts/install-termux.sh ]; then
            echo "✓ install-termux.sh found"
            head -1 artifacts/install-termux.sh
          else
            echo "ERROR: install-termux.sh missing"
            exit 1
          fi

          (cd artifacts && sha256sum -c SHA256SUMS)

      - name: Verify binary architecture
        run: |
          # Extract and verify the binary
          unzip -q artifacts/*.zip -d artifacts/extracted
          BINARY=$(find artifacts/extracted -name "opencode.bin" -type f | head -1)
          if [ -n "$BINARY" ]; then
            echo "Verifying binary: $BINARY"
            file "$BINARY"
            readelf -h "$BINARY" | grep -E "Machine|Class"
            if file "$BINARY" | grep -q "aarch64"; then
              echo "✓ Binary is ARM64 architecture"
            else
              echo "ERROR: Binary is not ARM64"
              exit 1
            fi
          else
            echo "ERROR: Binary not found in package"
            exit 1
          fi

      - name: Verify launcher self-exe override and module graph
        run: |
          LAUNCHER="artifacts/extracted/bin/opencode"
          BINARY="$(find artifacts/extracted -name 'opencode.bin' -type f | head -1)"
          [ -x "$LAUNCHER" ] || { echo "ERROR: packaged launcher missing at $LAUNCHER" >&2; exit 1; }
          [ -n "$BINARY" ] || { echo "ERROR: packaged opencode.bin missing" >&2; exit 1; }
          sh -n "$LAUNCHER"
          grep -qF 'export BUN_SELF_EXE=' "$LAUNCHER" || { echo "ERROR: packaged launcher does not export BUN_SELF_EXE" >&2; exit 1; }
          grep -aqF 'BUN_SELF_EXE' "$BINARY" || { echo "ERROR: packaged runtime lacks the BUN_SELF_EXE override" >&2; exit 1; }
          python3 scripts/transplant-bun-graph.py verify "$BINARY" --expect-stride "$MODULE_GRAPH_STRIDE"
          file artifacts/extracted/lib/libopentui.so | grep -q "aarch64" || { echo "ERROR: packaged libopentui.so is not aarch64" >&2; exit 1; }

      - name: Test the root-free installer with every archive
        run: |
          for artifact in artifacts/opencode-*.zip artifacts/opencode-*android-aarch64.tar.xz artifacts/opencode_*.deb artifacts/opencode-*.pkg.tar.xz; do
            [ -f "$artifact" ] || continue
            prefix="$(mktemp -d)"
            bash artifacts/install-termux.sh --prefix "$prefix" "$artifact"
            test -x "$prefix/bin/opencode"
            test -s "$prefix/libexec/opencode/opencode.bin"
            test -f "$prefix/lib/libopentui.so"
            rm -rf "$prefix"
          done
